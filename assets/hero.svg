<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">foodmap — a food blogger's Weibo posts on an interactive restaurant map</title>
  <desc id="desc">foodmap in large type beside a warm city-map panel: three geo-tagged pins of different sizes sit on a pale street basemap, each connected by a dotted line to a card that lists the dishes extracted from the post and the restaurant with its source post date. A strip below names the pipeline files: fetch-posts.mjs, normalize.mjs, extract.mjs, geocode-regions.mjs, index.html + app.js.</desc>

  <defs>
    <clipPath id="panel-clip">
      <rect x="552" y="76" width="592" height="244" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#f5ede0"/>

  <!-- Title block -->
  <g id="title-block">
    <text x="56" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" letter-spacing="2.4" fill="#c1642a">INTERACTIVE RESTAURANT MAP</text>
    <text x="56" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="72" font-weight="700" fill="#2b2118">foodmap</text>
    <text x="56" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22" fill="#5c4d3d">Turn a food blogger's public Weibo posts</text>
    <text x="56" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="22" fill="#5c4d3d">into an interactive restaurant map.</text>
    <text x="56" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="18" fill="#5c4d3d">283 restaurants · 312 visits</text>
  </g>

  <!-- City map panel: basemap, route, pins -->
  <g id="map-panel">
    <rect x="552" y="76" width="592" height="244" rx="18" fill="#fffaf2" stroke="#e8dcc8" stroke-width="1.5"/>

    <g clip-path="url(#panel-clip)" fill="none" stroke-linecap="round">
      <path d="M556 152 C612 140 664 162 748 148" stroke="#f0e4d0" stroke-width="9"/>
      <path d="M556 252 C616 264 664 238 748 256" stroke="#f0e4d0" stroke-width="9"/>
      <path d="M624 80 C632 140 614 216 630 316" stroke="#f0e4d0" stroke-width="7"/>
      <path d="M710 80 C700 148 716 240 706 316" stroke="#f0e4d0" stroke-width="7"/>
      <path d="M600 206 C640 196 660 212 700 202" stroke="#e8dcc8" stroke-width="2"/>
    </g>

    <!-- travel-route replay hop between two visits -->
    <path d="M660 122 C600 168 580 196 606 205" fill="none" stroke="#2f6f4f"
          stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>

    <!-- pins: size grows with visit count -->
    <g id="pins">
      <g transform="translate(660 150) scale(2.4)">
        <path d="M0 0 C-4.4 -6 -8 -8.6 -8 -14 A8 8 0 1 1 8 -14 C8 -8.6 4.4 -6 0 0 Z" fill="#963a17"/>
        <circle cx="0" cy="-14" r="3.2" fill="#fffaf2"/>
      </g>
      <g transform="translate(606 232) scale(1.9)">
        <path d="M0 0 C-4.4 -6 -8 -8.6 -8 -14 A8 8 0 1 1 8 -14 C8 -8.6 4.4 -6 0 0 Z" fill="#c1642a"/>
        <circle cx="0" cy="-14" r="3.2" fill="#fffaf2"/>
      </g>
      <g transform="translate(692 300) scale(1.5)">
        <path d="M0 0 C-4.4 -6 -8 -8.6 -8 -14 A8 8 0 1 1 8 -14 C8 -8.6 4.4 -6 0 0 Z" fill="#b9743a"/>
        <circle cx="0" cy="-14" r="3.2" fill="#fffaf2"/>
      </g>
    </g>

    <!-- pin resolving into its extracted dish card -->
    <g fill="none" stroke="#c1642a" stroke-width="1.5" stroke-dasharray="4 6">
      <path d="M680 124 L744 121"/>
      <path d="M622 205 L744 197"/>
      <path d="M705 279 L744 273"/>
    </g>
  </g>

  <!-- Dish cards: extracted dishes + restaurant + source post -->
  <g id="dish-cards" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="744" y="88" width="384" height="66" rx="14" fill="#fffaf2" stroke="#e8dcc8" stroke-width="1.5"/>
      <rect x="760" y="108" width="4" height="26" rx="2" fill="#963a17"/>
      <text x="778" y="118" font-size="22" font-weight="600" fill="#2b2118">双皮奶 · 姜撞奶</text>
      <text x="778" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c4d3d">民信老店 · post 2011-12-03</text>
      <text x="1112" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#c1642a" text-anchor="end">↗</text>
    </g>
    <g>
      <rect x="744" y="164" width="384" height="66" rx="14" fill="#fffaf2" stroke="#e8dcc8" stroke-width="1.5"/>
      <rect x="760" y="184" width="4" height="26" rx="2" fill="#c1642a"/>
      <text x="778" y="194" font-size="22" font-weight="600" fill="#2b2118">油鸡枞 · 炸酱面</text>
      <text x="778" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c4d3d">江南驿 · post 2017-09-19</text>
      <text x="1112" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#c1642a" text-anchor="end">↗</text>
    </g>
    <g>
      <rect x="744" y="240" width="384" height="66" rx="14" fill="#fffaf2" stroke="#e8dcc8" stroke-width="1.5"/>
      <rect x="760" y="260" width="4" height="26" rx="2" fill="#b9743a"/>
      <text x="778" y="270" font-size="22" font-weight="600" fill="#2b2118">黄鳝饭 · 烧羊肉</text>
      <text x="778" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5c4d3d">惠食佳 · post 2019-12-11</text>
      <text x="1112" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#c1642a" text-anchor="end">↗</text>
    </g>
  </g>

  <!-- Pipeline strip -->
  <g id="pipeline">
    <path d="M56 344 H1144" stroke="#e8dcc8" stroke-width="1.5" fill="none"/>
    <g fill="#c1642a">
      <circle cx="56" cy="344" r="4"/>
      <circle cx="274" cy="344" r="4"/>
      <circle cx="492" cy="344" r="4"/>
      <circle cx="710" cy="344" r="4"/>
      <circle cx="928" cy="344" r="4"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2b2118">
      <text x="56" y="376">fetch-posts.mjs</text>
      <text x="274" y="376">normalize.mjs</text>
      <text x="492" y="376">extract.mjs</text>
      <text x="710" y="376">geocode-regions.mjs</text>
      <text x="928" y="376">index.html + app.js</text>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#5c4d3d">
      <text x="56" y="400">scrape profile feed</text>
      <text x="274" y="400">geo tag (lat, lng)</text>
      <text x="492" y="400">LLM: name + dishes</text>
      <text x="710" y="400">region from coords</text>
      <text x="928" y="400">Leaflet map, static</text>
    </g>
  </g>
</svg>
