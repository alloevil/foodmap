# push 即 GitHub Pages 上线,这里是唯一的闸门:lint / 格式 / 单测任一挂掉,
# 起码能在 commit 状态上看到红叉。不跑 verify-render(要 Chrome + 起本地
# server,冒烟属于本地开发流程);puppeteer 依赖靠 .puppeteerrc.cjs 的
# skipDownload 跳过浏览器下载,npm ci 不会卡在下载 Chrome 上。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      # 用 coverage 版跑测试:同样的用例,顺带把覆盖率表打进 CI 日志,
      # "哪些文件没被测到"持续可见而不是本地算完就忘
      - run: npm run test:coverage
